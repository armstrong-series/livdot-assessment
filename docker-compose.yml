services:
    app:
        build: .
        ports:
            - "8000:8000"
        environment:
            APP_ENV: local
            APP_KEY: base64:0VGcbmDkMDH53ozZ0/JZa5CGI+qLZCo5BeJD6XtV+Io=
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: livedot
            DB_USERNAME: bumpa
            DB_PASSWORD: secret
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: livedot
            MYSQL_USER: bumpa
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
